<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff5500" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Brand Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Open Book Icon in Pure White -->
  <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 126)">
    <!-- Left and Right Page Wings -->
    <path d="M 150 260 L 150 40 M 150 40 C 95 10, 45 10, 0 40 L 0 260 C 45 230, 95 230, 150 260 C 205 230, 255 230, 300 260 L 300 40 C 255 10, 205 10, 150 40" />
  </g>
</svg>
